# ----
# Site

title: 고쳐드림
url: "https://proud-alligator.cloudvent.net"
baseurl: ""

# Values for the jekyll-seo-tag gem (https://github.com/jekyll/jekyll-seo-tag)
logo: "/siteicon.png"
description: Product marketing template for Jekyll.
email:

# -----
# Build

collections:
  staff_members:
    _hide_content: true

paginate: 10
paginate_path: "/work/:num/"
permalink: pretty

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"
      _options:
        content:
          width: 1500
          height: 2500
  - scope:
      path: ""
      type: "staff_members"
    values:
      _options:
        image_path:
          width: 600
          height: 600
  - scope:
      path: ""
    values:
      layout: "page"
  - scope:
      path: "index.html"
    values:
      layout: "default"
  - scope:
      path: "contact.html"
    values:
      full_width: true

jekyll-archives:
  enabled:
    - categories

plugins:
  - jekyll-archives
  - jekyll-sitemap
  - jekyll-seo-tag
  - jekyll-feed
  - jekyll-paginate

paginate: 10
paginate_path: "/works/page:num/"

exclude:
  - Gemfile
  - Gemfile.lock
  - README.md
  - LICENSE

sitemap: true

defaults:
  - scope:
      path: "_posts"
      type: posts
    values:
      permalink: /작업사례/:year-:month-:day-:title
