{% for post in include.posts %}
<li class="blog-post"
	data-category="{{ post.categories | join: ',' }}">

	<div class="post-thumbnail">
		{% if post.image %}
			<img src="{{ post.image }}" alt="{{ post.title }}">
		{% endif %}
	</div>

	<div class="post-info">

		<h3>
			<a href="{{ post.url | relative_url }}">
				{{ post.title }}
			</a>
		</h3>

		{% include post-title.html post=post %}

		<div class="post-content">

			<div class="button">
				<a href="{{ post.url | relative_url }}">
					더보기
				</a>
			</div>

		</div>

	</div>

</li>
{% endfor %}
