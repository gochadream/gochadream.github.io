
---
layout: page
title: 작업사례
description: 고쳐드림이 진행한 다양한 작업 사례를 사진과 함께 소개합니다
---

<div class="text-container">

    <p class="editor-link">
        <a href="cloudcannon:collections/_posts" class="btn">
            <strong>&#9998;</strong> Add Post
        </a>
    </p>

    <!-- 카테고리 필터 -->
    <div class="category-filter">
        <button type="button" class="active" data-category="all">
            전체
        </button>

        {% assign categories = site.categories | sort %}
        {% for category in categories %}
            <button type="button" data-category="{{ category[0] | escape }}">
                {{ category[0] }}
            </button>
        {% endfor %}
    </div>

    <!-- 포스트 목록 -->
    <ul class="blog-posts" id="post-list">
        {% include list-posts.html posts=site.posts %}
    </ul>

    <!-- 페이지네이션 -->
    <nav id="pagination-controls" aria-label="작업사례 페이지 이동">
        <button type="button" id="prev-group-btn" class="page-nav-btn">
            &laquo; 이전
        </button>

        <div id="page-numbers"></div>

        <button type="button" id="next-group-btn" class="page-nav-btn">
            다음 &raquo;
        </button>
    </nav>

</div>

<style>
    #pagination-controls {
        display: none;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 2.5rem 0 2rem;
    }

    #page-numbers {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
    }

    #pagination-controls button {
        min-width: 40px;
        height: 40px;
        padding: 0 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        color: #333;
        font-size: 15px;
        cursor: pointer;
    }

    #pagination-controls button:hover:not(:disabled) {
        background: #f0f0f0;
        border-color: #333;
    }

    #pagination-controls button.active {
        background: #333;
        border-color: #333;
        color: #fff;
        font-weight: bold;
    }

    #pagination-controls button:disabled {
        opacity: 0.4;
        cursor: not-allowed;
    }

    @media (max-width: 480px) {
        #pagination-controls {
            gap: 4px;
        }

        #page-numbers {
            gap: 3px;
        }

        #pagination-controls button {
            min-width: 32px;
            height: 36px;
            padding: 0 7px;
            font-size: 13px;
        }
    }
</style>

<script>
(function () {
    function initPagination() {
        const postsPerPage = 9;
        const pagesPerGroup = 10;

        const postList = document.getElementById("post-list");
        const pagination = document.getElementById("pagination-controls");
        const pageNumbers = document.getElementById("page-numbers");
        const prevButton = document.getElementById("prev-group-btn");
        const nextButton = document.getElementById("next-group-btn");

        if (!postList || !pagination || !pageNumbers || !prevButton || !nextButton) {
            return;
        }

        const categoryButtons = Array.from(
            document.querySelectorAll(".category-filter button")
        );

        const posts = Array.from(
            postList.querySelectorAll(".blog-post")
        );

        let currentPage = 1;

        function readURL() {
            const params = new URLSearchParams(window.location.search);

            const pageValue = parseInt(params.get("page"), 10);
            const category = params.get("tab") || "all";

            return {
                page: Number.isFinite(pageValue) && pageValue > 0
                    ? pageValue
                    : 1,
                category: category
            };
        }

        function writeURL(page, category, replace) {
            const params = new URLSearchParams(window.location.search);

            if (category === "all") {
                params.delete("tab");
            } else {
                params.set("tab", category);
            }

            // 첫 페이지는 별도 page 파라미터를 사용하지 않음
            if (page <= 1) {
                params.delete("page");
            } else {
                params.set("page", String(page));
            }

            const query = params.toString();

            const url = window.location.pathname +
                (query ? "?" + query : "") +
                window.location.hash;

            if (replace) {
                window.history.replaceState(null, "", url);
            } else {
                window.history.pushState(null, "", url);
            }
        }

        function getFilteredPosts(category) {
            return posts.filter(function (post) {
                if (category === "all") {
                    return true;
                }

                const postCategories = (post.dataset.category || "")
                    .split(",")
                    .map(function (item) {
                        return item.trim();
                    });

                return postCategories.includes(category);
            });
        }

        function render() {
            const urlState = readURL();
            const category = urlState.category;
            const filteredPosts = getFilteredPosts(category);

            const totalPages = Math.ceil(
                filteredPosts.length / postsPerPage
            );

            const safeTotalPages = Math.max(1, totalPages);

            // URL에 기록된 페이지를 범위 안으로 조정
            currentPage = Math.min(
                Math.max(1, urlState.page),
                safeTotalPages
            );

            // 유효하지 않은 페이지 주소를 정리
            if (urlState.page !== currentPage) {
                writeURL(currentPage, category, true);
            }

            // 카테고리 버튼 활성화
            categoryButtons.forEach(function (button) {
                const active = button.dataset.category === category;

                button.classList.toggle("active", active);
                button.setAttribute("aria-pressed", String(active));
            });

            // 모든 포스트 숨기기
            posts.forEach(function (post) {
                post.style.display = "none";
            });

            // 현재 페이지 포스트 표시
            const start = (currentPage - 1) * postsPerPage;
            const visiblePosts = filteredPosts.slice(
                start,
                start + postsPerPage
            );

            visiblePosts.forEach(function (post) {
                post.style.display = "";
            });

            // 페이지가 하나 이하이면 페이지네이션 숨기기
            if (totalPages <= 1) {
                pagination.style.display = "none";
                pageNumbers.innerHTML = "";
                return;
            }

            pagination.style.display = "flex";
            pageNumbers.innerHTML = "";

            // 현재 페이지가 속한 번호 묶음
            const groupIndex = Math.floor(
                (currentPage - 1) / pagesPerGroup
            );

            const firstPage = groupIndex * pagesPerGroup + 1;
            const lastPage = Math.min(
                firstPage + pagesPerGroup - 1,
                totalPages
            );

            // 페이지 번호 버튼 만들기
            for (let page = firstPage; page <= lastPage; page++) {
                const button = document.createElement("button");

                button.type = "button";
                button.textContent = String(page);

                if (page === currentPage) {
                    button.classList.add("active");
                    button.setAttribute("aria-current", "page");
                }

                button.addEventListener("click", function () {
                    if (page === currentPage) {
                        return;
                    }

                    currentPage = page;
                    writeURL(currentPage, category, false);
                    render();

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                });

                pageNumbers.appendChild(button);
            }

            // 이전/다음 번호 묶음
            prevButton.style.display =
                firstPage > 1 ? "" : "none";

            nextButton.style.display =
                lastPage < totalPages ? "" : "none";
        }

        // 카테고리 변경
        categoryButtons.forEach(function (button) {
            button.addEventListener("click", function () {
                const category = button.dataset.category;

                currentPage = 1;
                writeURL(1, category, false);
                render();
            });
        });

        // 이전 10개 페이지 번호
        prevButton.addEventListener("click", function () {
            const groupIndex = Math.floor(
                (currentPage - 1) / pagesPerGroup
            );

            const targetPage = groupIndex * pagesPerGroup;

            if (targetPage >= 1) {
                currentPage = targetPage;
                writeURL(currentPage, readURL().category, false);
                render();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        });

        // 다음 10개 페이지 번호
        nextButton.addEventListener("click", function () {
            const groupIndex = Math.floor(
                (currentPage - 1) / pagesPerGroup
            );

            const targetPage = (groupIndex + 1) * pagesPerGroup + 1;
            const category = readURL().category;
            const totalPages = Math.ceil(
                getFilteredPosts(category).length / postsPerPage
            );

            if (targetPage <= totalPages) {
                currentPage = targetPage;
                writeURL(currentPage, category, false);
                render();

                window.scrollTo({
                    top: 0,
                    behavior: "smooth"
                });
            }
        });

        // 브라우저 뒤로 가기 / 앞으로 가기
        window.addEventListener("popstate", function () {
            currentPage = readURL().page;
            render();
        });

        // 최초 로드
        currentPage = readURL().page;

        // 잘못된 카테고리 주소 처리
        const initialCategory = readURL().category;
        const validCategory = initialCategory === "all" ||
            categoryButtons.some(function (button) {
                return button.dataset.category === initialCategory;
            });

        if (!validCategory) {
            writeURL(1, "all", true);
            currentPage = 1;
        }

        render();
    }

    if (document.readyState === "loading") {
        document.addEventListener("DOMContentLoaded", initPagination);
    } else {
        initPagination();
    }
})();
</script>
