
---
layout: page
title: 작업사례
description: 고쳐드림이 진행한 다양한 작업 사례를 사진과 함께 소개합니다
---

<div class="text-container">

    <p class="editor-link">
        <a href="cloudcannon:collections/_posts" class="btn">
            <strong>&#9998;</strong> Add Post
        </a>
    </p>

    <!-- 카테고리 필터 -->
    <div class="category-filter">
        <button class="active" data-category="all">
            전체
        </button>

        {% assign categories = site.categories | sort %}
        {% for category in categories %}
            <button data-category="{{ category[0] | escape }}">
                {{ category[0] }}
            </button>
        {% endfor %}
    </div>

    <!-- 포스트 목록 -->
    <ul class="blog-posts" id="post-list">
        {% include list-posts.html posts=site.posts %}
    </ul>

    <!-- 숫자형 페이지네이션 -->
    <nav
        class="pagination"
        id="pagination-controls"
        aria-label="작업사례 페이지 이동"
    >
        <button
            type="button"
            id="prev-group-btn"
            class="page-nav-btn"
            aria-label="이전 페이지 번호 묶음"
        >
            &laquo; 이전
        </button>

        <div
            class="page-numbers"
            id="page-numbers"
            aria-label="페이지 번호"
        ></div>

        <button
            type="button"
            id="next-group-btn"
            class="page-nav-btn"
            aria-label="다음 페이지 번호 묶음"
        >
            다음 &raquo;
        </button>
    </nav>

</div>

<style>
    /* 페이지네이션 전체 */
    #pagination-controls {
        display: none;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 2.5rem 0 2rem;
    }

    /* 페이지 번호 영역 */
    #pagination-controls .page-numbers {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px;
    }

    /* 페이지 번호 및 이전/다음 버튼 공통 */
    #pagination-controls button {
        display: inline-flex;
        justify-content: center;
        align-items: center;
        min-width: 42px;
        height: 42px;
        padding: 0 12px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        color: #333;
        font-size: 15px;
        line-height: 1;
        cursor: pointer;
        transition:
            background-color 0.2s ease,
            color 0.2s ease,
            border-color 0.2s ease;
    }

    /* 마우스 오버 */
    #pagination-controls button:hover:not(:disabled) {
        border-color: #333;
        background: #f3f3f3;
    }

    /* 현재 페이지 */
    #pagination-controls button.active {
        border-color: #333;
        background: #333;
        color: #fff;
        font-weight: 700;
    }

    /* 현재 페이지의 포커스 표시 */
    #pagination-controls button:focus-visible {
        outline: 2px solid #555;
        outline-offset: 3px;
    }

    /* 비활성화된 버튼 */
    #pagination-controls button:disabled {
        opacity: 0.35;
        cursor: not-allowed;
    }

    /* 모바일 대응 */
    @media (max-width: 480px) {
        #pagination-controls {
            gap: 5px;
        }

        #pagination-controls .page-numbers {
            gap: 4px;
        }

        #pagination-controls button {
            min-width: 34px;
            height: 36px;
            padding: 0 8px;
            font-size: 13px;
        }
    }
</style>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const postsPerPage = 9;       // 한 페이지당 포스트 수
    const pageButtonsPerGroup = 10; // 한 번에 표시할 페이지 번호 수

    let currentPage = 1;

    const buttons = document.querySelectorAll(
        ".category-filter button"
    );

    const allPosts = Array.from(
        document.querySelectorAll("#post-list .blog-post")
    );

    const paginationContainer = document.getElementById(
        "pagination-controls"
    );

    const pageNumbers = document.getElementById("page-numbers");
    const prevGroupBtn = document.getElementById("prev-group-btn");
    const nextGroupBtn = document.getElementById("next-group-btn");

    // URL에서 카테고리 읽기
    function getCategoryFromURL() {
        const params = new URLSearchParams(window.location.search);
        return params.get("tab") || "all";
    }

    // URL에서 페이지 번호 읽기
    function getPageFromURL() {
        const params = new URLSearchParams(window.location.search);
        const page = parseInt(params.get("page"), 10);

        return Number.isInteger(page) && page > 0 ? page : 1;
    }

    // 현재 카테고리에 해당하는 포스트 가져오기
    function getFilteredPosts() {
        const currentCategory = getCategoryFromURL();

        return allPosts.filter(post => {
            if (currentCategory === "all") {
                return true;
            }

            const categories = (post.dataset.category || "")
                .split(",")
                .map(category => category.trim());

            return categories.includes(currentCategory);
        });
    }

    // URL 변경
    function updateURL(page, category, replace = false) {
        const params = new URLSearchParams(window.location.search);

        if (category === "all") {
            params.delete("tab");
        } else {
            params.set("tab", category);
        }

        if (page <= 1) {
            params.delete("page");
        } else {
            params.set("page", String(page));
        }

        const query = params.toString();

        const newURL =
            window.location.pathname +
            (query ? "?" + query : "") +
            window.location.hash;

        if (replace) {
            window.history.replaceState(null, "", newURL);
        } else {
            window.history.pushState(null, "", newURL);
        }
    }

    // 페이지 이동
    function goToPage(page) {
        const filteredPosts = getFilteredPosts();
        const totalPages = Math.ceil(
            filteredPosts.length / postsPerPage
        );

        if (totalPages === 0) {
            return;
        }

        const targetPage = Math.max(
            1,
            Math.min(page, totalPages)
        );

        currentPage = targetPage;

        updateURL(targetPage, getCategoryFromURL());
        updateDisplay();

        window.scrollTo({
            top: 0,
            behavior: "smooth"
        });
    }

    // 페이지 번호 버튼 생성
    function renderPageNumbers(totalPages) {
        pageNumbers.innerHTML = "";

        // 현재 페이지가 속한 번호 묶음 계산
        // 예: 1~10, 11~20, 21~30
        const currentGroup = Math.floor(
            (currentPage - 1) / pageButtonsPerGroup
        );

        const startPage =
            currentGroup * pageButtonsPerGroup + 1;

        const endPage = Math.min(
            startPage + pageButtonsPerGroup - 1,
            totalPages
        );

        // 현재 번호 묶음의 페이지 버튼 생성
        for (let page = startPage; page <= endPage; page++) {
            const button = document.createElement("button");

            button.type = "button";
            button.textContent = String(page);
            button.className = "page-number";

            // 페이지별 고유 URL을 링크처럼 확인할 수 있도록 설정
            const params = new URLSearchParams(
                window.location.search
            );

            if (getCategoryFromURL() === "all") {
                params.delete("tab");
            }

            if (page === 1) {
                params.delete("page");
            } else {
                params.set("page", String(page));
            }

            const query = params.toString();

            button.dataset.url =
                window.location.pathname +
                (query ? "?" + query : "") +
                window.location.hash;

            if (page === currentPage) {
                button.classList.add("active");
                button.setAttribute("aria-current", "page");
                button.setAttribute("aria-label", `현재 페이지 ${page}`);
            } else {
                button.setAttribute("aria-label", `${page} 페이지`);
            }

            button.addEventListener("click", () => {
                goToPage(page);
            });

            pageNumbers.appendChild(button);
        }

        // 이전/다음 번호 묶음 버튼 상태
        prevGroupBtn.disabled = currentGroup === 0;
        nextGroupBtn.disabled = endPage >= totalPages;

        prevGroupBtn.style.display =
            currentGroup === 0 ? "none" : "inline-flex";

        nextGroupBtn.style.display =
            endPage >= totalPages ? "none" : "inline-flex";
    }

    // 화면 업데이트
    function updateDisplay() {
        const currentCategory = getCategoryFromURL();
        const filteredPosts = getFilteredPosts();

        const totalPages = Math.ceil(
            filteredPosts.length / postsPerPage
        );

        // URL에 없는 카테고리가 지정된 경우 전체 카테고리로 복구
        const categoryExists =
            currentCategory === "all" ||
            Array.from(buttons).some(
                button => button.dataset.category === currentCategory
            );

        if (!categoryExists) {
            updateURL(1, "all", true);
            currentPage = 1;
            return updateDisplay();
        }

        // 카테고리 버튼 active 상태
        buttons.forEach(button => {
            const isActive =
                button.dataset.category === currentCategory;

            button.classList.toggle("active", isActive);

            if (isActive) {
                button.setAttribute("aria-pressed", "true");
            } else {
                button.setAttribute("aria-pressed", "false");
            }
        });

        // 페이지가 범위를 벗어나면 마지막 페이지로 보정
        if (totalPages > 0 && currentPage > totalPages) {
            currentPage = totalPages;
            updateURL(currentPage, currentCategory, true);
        }

        // 모든 포스트 숨기기
        allPosts.forEach(post => {
            post.style.display = "none";
        });

        // 현재 페이지의 포스트만 표시
        const startIndex = (currentPage - 1) * postsPerPage;

        const visiblePosts = filteredPosts.slice(
            startIndex,
            startIndex + postsPerPage
        );

        visiblePosts.forEach(post => {
            post.style.display = "";
        });

        // 포스트가 없거나 페이지가 하나뿐이면 페이지네이션 숨김
        if (totalPages <= 1) {
            paginationContainer.style.display = "none";
            return;
        }

        paginationContainer.style.display = "flex";

        renderPageNumbers(totalPages);
    }

    // 카테고리 클릭
    buttons.forEach(button => {
        button.addEventListener("click", () => {
            const category = button.dataset.category;

            currentPage = 1;

            updateURL(1, category);
            updateDisplay();
        });
    });

    // 이전 페이지 번호 묶음
    prevGroupBtn.addEventListener("click", () => {
        const currentGroup = Math.floor(
            (currentPage - 1) / pageButtonsPerGroup
        );

        goToPage(
            currentGroup * pageButtonsPerGroup
        );
    });

    // 다음 페이지 번호 묶음
    nextGroupBtn.addEventListener("click", () => {
        const currentGroup = Math.floor(
            (currentPage - 1) / pageButtonsPerGroup
        );

        goToPage(
            (currentGroup + 1) * pageButtonsPerGroup + 1
        );
    });

    // 브라우저 뒤로 가기 / 앞으로 가기
    window.addEventListener("popstate", () => {
        currentPage = getPageFromURL();
        updateDisplay();
    });

    // 최초 페이지 로드
    currentPage = getPageFromURL();

    // 잘못된 페이지 URL은 정상 페이지 범위로 보정
    const initialTotalPages = Math.ceil(
        getFilteredPosts().length / postsPerPage
    );

    if (currentPage > Math.max(1, initialTotalPages)) {
        currentPage = Math.max(1, initialTotalPages);
        updateURL(currentPage, getCategoryFromURL(), true);
    }

    updateDisplay();
});
</script>
