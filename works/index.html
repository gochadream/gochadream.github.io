---
layout: page
title: 작업사례
description: 고쳐드림이 진행한 다양한 작업 사례를 사진과 함께 소개합니다
---

<div class="text-container">

    <p class="editor-link">
        <a href="cloudcannon:collections/_posts" class="btn">
            <strong>&#9998;</strong> Add Post
        </a>
    </p>

    <div class="category-filter">
        <button class="active" data-category="all">
            전체
        </button>

        {% assign categories = site.categories | sort %}
        {% for category in categories %}
            <button data-category="{{ category[0] }}">
                {{ category[0] }}
            </button>
        {% endfor %}
    </div>

    <!-- 포스트 목록 -->
    <ul class="blog-posts" id="post-list">
        {% include list-posts.html posts=site.posts %}
    </ul>

    <!-- 디자인을 정돈한 페이지네이션 -->
    <div class="pagination" id="pagination-controls" style="text-align: center; margin-top: 2.5rem; margin-bottom: 2rem;">
        <a href="#" id="prev-btn" class="btn" style="margin-right: 12px; display: inline-block;">
            &larr; 이전
        </a>

        <span id="page-info" style="font-weight: 600; margin: 0 12px; vertical-align: middle; font-size: 1.05rem;">
            1 / 1
        </span>

        <a href="#" id="next-btn" class="btn" style="margin-left: 12px; display: inline-block;">
            다음 &rarr;
        </a>
    </div>

</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const postsPerPage = 9; // 한 페이지당 표시할 포스트 수
    let currentPage = 1;

    const buttons = document.querySelectorAll(".category-filter button");
    const allPosts = Array.from(document.querySelectorAll("#post-list .blog-post"));
    const paginationContainer = document.getElementById("pagination-controls");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const pageInfo = document.getElementById("page-info");

    // 1. URL에서 ?tab= 값 읽어오기
    function getCategoryFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('tab') || 'all';
    }

    // 2. 화면 필터링 및 페이지 계산
    function updateDisplay() {
        const currentCategory = getCategoryFromURL();

        // 카테고리 버튼 active 상태 변경
        buttons.forEach(btn => {
            if (btn.dataset.category === currentCategory) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });

        // 카테고리별 포스트 필터링
        const filteredPosts = allPosts.filter(post => {
            if (currentCategory === "all") return true;
            const categories = (post.dataset.category || "").split(",").map(c => c.trim());
            return categories.includes(currentCategory);
        });

        // 총 페이지 수 계산
        const totalPages = Math.ceil(filteredPosts.length / postsPerPage) || 1;
        if (currentPage > totalPages) currentPage = 1;

        // 전체 포스트 숨긴 후 현재 페이지 분량만 표시
        allPosts.forEach(post => post.style.display = "none");

        const startIdx = (currentPage - 1) * postsPerPage;
        const endIdx = startIdx + postsPerPage;
        const visiblePosts = filteredPosts.slice(startIdx, endIdx);

        visiblePosts.forEach(post => post.style.display = "");

        // 페이지네이션 컨트롤 표시/숨김 및 정보 업데이트
        if (totalPages > 1) {
            paginationContainer.style.display = "block";
            pageInfo.textContent = `${currentPage} / ${totalPages}`;

            prevBtn.style.display = currentPage === 1 ? "none" : "inline-block";
            nextBtn.style.display = currentPage === totalPages ? "none" : "inline-block";
        } else {
            paginationContainer.style.display = "none";
        }
    }

    // 3. 카테고리 클릭 시 URL 파라미터 변경
    buttons.forEach(button => {
        button.addEventListener("click", () => {
            const category = button.dataset.category;
            const searchParams = new URLSearchParams(window.location.search);

            if (category === "all") {
                searchParams.delete('tab');
            } else {
                searchParams.set('tab', category);
            }

            const newRelativePathQuery = window.location.pathname + (searchParams.toString() ? '?' + searchParams.toString() : '');
            window.history.pushState(null, '', newRelativePathQuery);

            currentPage = 1;
            updateDisplay();
        });
    });

    // 4. 페이지 이동 버튼 이벤트
    prevBtn.addEventListener("click", (e) => {
        e.preventDefault();
        if (currentPage > 1) {
            currentPage--;
            updateDisplay();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    });

    nextBtn.addEventListener("click", (e) => {
        e.preventDefault();
        const currentCategory = getCategoryFromURL();
        const filteredLength = allPosts.filter(post => {
            if (currentCategory === "all") return true;
            return (post.dataset.category || "").split(",").map(c => c.trim()).includes(currentCategory);
        }).length;
        const totalPages = Math.ceil(filteredLength / postsPerPage);

        if (currentPage < totalPages) {
            currentPage++;
            updateDisplay();
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }
    });

    // 뒤로가기/앞으로가기 대응
    window.addEventListener('popstate', () => {
        currentPage = 1;
        updateDisplay();
    });

    // 최초 렌더링
    updateDisplay();
});
</script>
