---
layout: page
title: 작업사례
description: 고쳐드림이 진행한 다양한 작업 사례를 사진과 함께 소개합니다
---

<div class="text-container">

    <p class="editor-link">
        <a href="cloudcannon:collections/_posts" class="btn">
            <strong>&#9998;</strong> Add Post
        </a>
    </p>

    <div class="category-filter">
        <button class="active" data-category="all">
            전체
        </button>

        {% assign categories = site.categories | sort %}
        {% for category in categories %}
            <button data-category="{{ category[0] }}">
                {{ category[0] }}
            </button>
        {% endfor %}
    </div>

    <!-- 포스트 목록 -->
    <ul class="blog-posts" id="post-list">
        {% include list-posts.html posts=site.posts %}
    </ul>


    <!-- 숫자형 페이지네이션 -->
    <div class="pagination" id="pagination-controls"
        style="text-align:center; margin-top:2.5rem; margin-bottom:2rem;">

        <button type="button" id="prev-btn" class="btn">
            &larr; 이전
        </button>

        <span id="page-numbers"
            style="display:inline-flex; gap:6px; margin:0 12px; vertical-align:middle;">
        </span>

        <button type="button" id="next-btn" class="btn">
            다음 &rarr;
        </button>

    </div>


</div>

<script>
document.addEventListener("DOMContentLoaded", () => {
    const postsPerPage = 9; // 한 페이지당 표시할 포스트 수
    let currentPage = 1;

    const buttons = document.querySelectorAll(".category-filter button");
    const allPosts = Array.from(document.querySelectorAll("#post-list .blog-post"));
    const paginationContainer = document.getElementById("pagination-controls");
    const prevBtn = document.getElementById("prev-btn");
    const nextBtn = document.getElementById("next-btn");
    const pageInfo = document.getElementById("page-info");

    // 1. URL에서 ?tab= 값 읽어오기
    function getCategoryFromURL() {
        const urlParams = new URLSearchParams(window.location.search);
        return urlParams.get('tab') || 'all';
    }

    // 2. 화면 필터링 및 페이지 계산
    function updateDisplay() {
        const currentCategory = getCategoryFromURL();

        // 카테고리 버튼 active 상태 변경
        buttons.forEach(btn => {
            if (btn.dataset.category === currentCategory) {
                btn.classList.add("active");
            } else {
                btn.classList.remove("active");
            }
        });

        // 카테고리별 포스트 필터링
        const filteredPosts = allPosts.filter(post => {
            if (currentCategory === "all") return true;
            const categories = (post.dataset.category || "").split(",").map(c => c.trim());
            return categories.includes(currentCategory);
        });

        // 총 페이지 수 계산
        const totalPages = Math.ceil(filteredPosts.length / postsPerPage) || 1;
        if (currentPage > totalPages) currentPage = 1;

        // 전체 포스트 숨긴 후 현재 페이지 분량만 표시
        allPosts.forEach(post => post.style.display = "none");

        const startIdx = (currentPage - 1) * postsPerPage;
        const endIdx = startIdx + postsPerPage;
        const visiblePosts = filteredPosts.slice(startIdx, endIdx);

        visiblePosts.forEach(post => post.style.display = "");

       
        // 숫자형 페이지네이션
        const pagesPerGroup = 10;

        if (totalPages > 1) {
            paginationContainer.style.display = "flex";

            const pageNumbers = document.getElementById("page-numbers");
            pageNumbers.innerHTML = "";

            const groupStart =
                Math.floor((currentPage - 1) / pagesPerGroup)
                * pagesPerGroup + 1;

            const groupEnd = Math.min(
                groupStart + pagesPerGroup - 1,
                totalPages
            );

            for (let page = groupStart; page <= groupEnd; page++) {
                const btn = document.createElement("button");
                btn.type = "button";
                btn.textContent = page;

                if (page === currentPage) {
                    btn.classList.add("active");
                    btn.setAttribute("aria-current", "page");
                }

                btn.addEventListener("click", () => {
                    currentPage = page;

                    const params = new URLSearchParams(
                        window.location.search
                    );

                    if (page === 1) {
                        params.delete("page");
                    } else {
                        params.set("page", page);
                    }

                    const query = params.toString();
                    const url = window.location.pathname +
                        (query ? "?" + query : "");

                    window.history.pushState(null, "", url);
                    updateDisplay();

                    window.scrollTo({
                        top: 0,
                        behavior: "smooth"
                    });
                });

                pageNumbers.appendChild(btn);
            }

            prevBtn.style.display =
                groupStart > 1 ? "inline-block" : "none";

            nextBtn.style.display =
                groupEnd < totalPages ? "inline-block" : "none";

        } else {
            paginationContainer.style.display = "none";
        }

    }

    // 3. 카테고리 클릭 시 URL 파라미터 변경
    buttons.forEach(button => {
        button.addEventListener("click", () => {
            const category = button.dataset.category;
            const searchParams = new URLSearchParams(window.location.search);

            if (category === "all") {
                searchParams.delete('tab');
            } else {
                searchParams.set('tab', category);
            }

            const newRelativePathQuery = window.location.pathname + (searchParams.toString() ? '?' + searchParams.toString() : '');
            window.history.pushState(null, '', newRelativePathQuery);

            currentPage = 1;
            updateDisplay();
        });
    });

    // 4. 페이지 이동 버튼 이벤트
    
    // 이전 버튼: 현재 페이지에서 1페이지 이전으로 이동
    prevBtn.addEventListener("click", (e) => {
        e.preventDefault();

        if (currentPage > 1) {
            currentPage--;

            const params = new URLSearchParams(window.location.search);

            if (currentPage === 1) {
                params.delete("page");
            } else {
                params.set("page", currentPage);
            }

            const query = params.toString();

            window.history.pushState(
                null,
                "",
                window.location.pathname + (query ? "?" + query : "")
            );

            updateDisplay();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    });

    // 다음 버튼: 현재 페이지에서 1페이지 다음으로 이동
    nextBtn.addEventListener("click", (e) => {
        e.preventDefault();

        const currentCategory = getCategoryFromURL();

        const filteredLength = allPosts.filter(post => {
            if (currentCategory === "all") return true;

            return (post.dataset.category || "")
                .split(",")
                .map(c => c.trim())
                .includes(currentCategory);
        }).length;

        const totalPages = Math.ceil(filteredLength / postsPerPage);

        if (currentPage < totalPages) {
            currentPage++;

            const params = new URLSearchParams(window.location.search);

            if (currentPage === 1) {
                params.delete("page");
            } else {
                params.set("page", currentPage);
            }

            const query = params.toString();

            window.history.pushState(
                null,
                "",
                window.location.pathname + (query ? "?" + query : "")
            );

            updateDisplay();

            window.scrollTo({
                top: 0,
                behavior: "smooth"
            });
        }
    });


    // 뒤로가기/앞으로가기 대응
    window.addEventListener('popstate', () => {
        currentPage = 1;
        updateDisplay();
    });

    // 최초 렌더링
    updateDisplay();
});
</script>


<style>
    /* 페이지 번호 전체 영역 */
    #pagination-controls {
        display: flex;
        justify-content: center;
        align-items: center;
        flex-wrap: wrap;
        gap: 8px;
        margin: 40px 0 32px;
    }

    /* 숫자 버튼 묶음 */
    #page-numbers {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        flex-wrap: wrap;
        gap: 6px;
    }

    /* 숫자 및 이전/다음 버튼 */
    #pagination-controls button {
        min-width: 40px;
        height: 40px;
        padding: 0 10px;
        border: 1px solid #ddd;
        border-radius: 6px;
        background: #fff;
        color: #333;
        font-size: 14px;
        cursor: pointer;
        transition: all 0.2s ease;
    }

    /* 마우스를 올렸을 때 */
    #pagination-controls button:hover {
        border-color: #333;
        background: #f3f3f3;
    }

    /* 현재 페이지 버튼 */
    #pagination-controls button.active {
        background: #333;
        color: #fff;
        border-color: #333;
        font-weight: 700;
    }

    /* 모바일 화면 */
    @media (max-width: 480px) {
        #pagination-controls {
            gap: 5px;
        }

        #page-numbers {
            gap: 4px;
        }

        #pagination-controls button {
            min-width: 32px;
            height: 36px;
            padding: 0 7px;
            font-size: 13px;
        }
    }

</style>
